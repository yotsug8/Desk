name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Проверка синтаксиса JS
        run: for f in js/*.js tests/*.js tests/*.mjs; do node --check "$f"; done
      - name: Локальный Supabase с миграциями
        run: npx supabase start
      - name: Браузер для тестов
        run: npx playwright install --with-deps chromium
      - name: Тесты Playwright
        run: npx playwright test
        env:
          CI: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  # Боевая база Supabase: создаётся и обновляется после зелёных тестов, если задан секрет.
  # Скрипт повторно безопасен: проект ищется по имени, применённые миграции пропускаются.
  prod-db:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Подъём и миграции
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: node scripts/setup-prod.mjs
      - name: Публичные адрес и ключ для сайта
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: |
          grep -A3 'const PROD' js/config.js
          grep -A3 'const PROD' js/config.js >> "$GITHUB_STEP_SUMMARY"
