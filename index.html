<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#b48a5e">
  <title>Доска</title>
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=PT+Serif:wght@400;700&display=swap">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Доска">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <!-- Стартовый экран и вход -->
  <main id="gate" class="gate" hidden></main>

  <!-- Доска -->
  <div id="app" class="app" hidden>
    <div id="stage" class="stage">
      <div id="world" class="world">
        <svg id="strings" class="strings" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>
    </div>
    <div id="cursors" class="cursors"></div>
    <div id="seltools" class="bar seltools" hidden></div>
    <div id="ctx" class="pop ctx" hidden></div>

    <header class="top">
      <div class="bar topbar">
        <button id="btnMenu" class="ib" type="button" aria-label="Меню доски"></button>
        <div id="titleLabel" class="title-label">
          <span id="boardTitle"></span>
          <small id="status" class="status"></small>
        </div>
      </div>
      <div class="sp"></div>
      <div id="timer" class="bar timer" hidden></div>
      <div id="people" class="people"></div>
      <button id="btnHistory" class="bar btn" type="button"></button>
      <button id="btnInvite" class="btn pri" type="button" aria-label="Пригласить"></button>
    </header>
    <div id="menu" class="pop menu" hidden></div>
    <div id="followBar" class="bar followbar" hidden></div>
    <div id="requests" class="requests" hidden></div>
    <div id="find" class="bar findbar" hidden></div>

    <nav id="ledge" class="ledge" aria-label="Инструменты"></nav>
    <div class="corner">
      <div id="minimap" class="minimap" hidden title="Карта доски: нажмите, чтобы перейти"></div>
      <div id="zoom" class="bar zoom" aria-label="Масштаб"></div>
    </div>
    <div id="pens" class="bar pens" hidden></div>
    <div id="undo" class="undo" hidden></div>
    <div id="hint" class="hint" hidden>
      <b>Доска пуста</b>
      <span>Выберите заметку на панели внизу или нажмите правой кнопкой по доске</span>
    </div>

    <aside id="history" class="hist" hidden></aside>
    <div id="pastBar" class="bar pastbar" hidden></div>
  </div>

  <div id="modal" class="modal" hidden></div>
  <div id="toasts" class="toasts"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js" crossorigin="anonymous"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
