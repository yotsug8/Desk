<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f1ea">
  <title>Доска</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232b2a27'/%3E%3Crect x='10' y='10' width='12' height='12' rx='2' fill='%23f6d365'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <!-- Стартовый экран и вход -->
  <main id="gate" class="gate" hidden></main>

  <!-- Доска -->
  <div id="app" class="app" hidden>
    <canvas id="grid" class="grid"></canvas>
    <div id="stage" class="stage">
      <div id="world" class="world"></div>
    </div>
    <div id="cursors" class="cursors"></div>
    <div id="seltools" class="card seltools" hidden></div>

    <header class="top">
      <div class="card title">
        <div class="logo"><i></i></div>
        <span id="boardTitle" class="board-title"></span>
        <small id="status" class="status"></small>
      </div>
      <div class="sp"></div>
      <div id="people" class="card people" hidden></div>
      <button id="btnHistory" class="card btn" type="button"></button>
      <button id="btnInvite" class="card btn pri" type="button"></button>
    </header>

    <nav id="tools" class="card tools"></nav>
    <div class="card zoom">
      <button id="zoomOut" class="t" type="button" aria-label="Отдалить"></button>
      <button id="zoomReset" class="zoom-val" type="button">100%</button>
      <button id="zoomIn" class="t" type="button" aria-label="Приблизить"></button>
    </div>

    <aside id="history" class="card hist" hidden></aside>
    <div id="pastBar" class="card pastbar" hidden></div>
  </div>

  <div id="modal" class="modal" hidden></div>
  <div id="toasts" class="toasts"></div>

  <script src="vendor/supabase.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
