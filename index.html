<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#5b3a1f">
  <title>Доска</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%235b3a1f'/%3E%3Crect x='4' y='4' width='24' height='24' fill='%23bf8f59'/%3E%3Crect x='9' y='10' width='14' height='13' fill='%23f6d860' transform='rotate(-4 16 16)'/%3E%3Ccircle cx='16' cy='10' r='3' fill='%23b3261e'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=PT+Serif:wght@400;700&display=swap">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <!-- Стартовый экран и вход -->
  <main id="gate" class="gate" hidden></main>

  <!-- Доска -->
  <div id="app" class="app" hidden>
    <div id="stage" class="stage">
      <div id="world" class="world">
        <svg id="strings" class="strings" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>
    </div>
    <div id="cursors" class="cursors"></div>
    <div id="seltools" class="seltools" hidden></div>
    <div id="radial" class="radial" hidden></div>

    <header class="top">
      <div id="titleLabel" class="label title-label">
        <span id="boardTitle"></span>
        <small id="status" class="status"></small>
      </div>
      <div class="sp"></div>
      <div id="people" class="people"></div>
      <button id="btnInvite" class="label invite" type="button">Пригласить</button>
    </header>

    <div id="voteBar" class="votebar" hidden></div>
    <div id="followBar" class="followbar" hidden></div>

    <nav id="ledge" class="ledge" aria-label="Инструменты"></nav>
    <div id="undo" class="undo" hidden></div>
    <div id="hint" class="hint" hidden>
      <span>Возьми заметку с полочки<br>и приколи куда хочешь</span>
      <svg viewBox="0 0 120 90" aria-hidden="true"><path d="M10 8 C 60 10, 90 30, 100 78 M88 66 L100 80 L108 64"/></svg>
    </div>
    <button id="btnHistory" class="clock" type="button" aria-label="История" title="История"><i class="h"></i><i class="m"></i><b></b></button>

    <aside id="history" class="hist" hidden></aside>
    <div id="pastBar" class="pastbar" hidden></div>
    <div class="frame"></div>
  </div>

  <div id="modal" class="modal" hidden></div>
  <div id="toasts" class="toasts"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js" crossorigin="anonymous"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
